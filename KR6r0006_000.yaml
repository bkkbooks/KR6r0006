body:
  text: 十六羅漢因果識見頌并序余嘗覽釋教大藏經究諸善之理見諸佛菩薩施廣大慈悲力啓利益方便門大自天地山河細及昆蟲草木種種善諭開悟迷徒奈何業結障蔽深高著惡昧善者多見性識心者少故佛佛留訓祖祖垂言以濟羣生以成大願所以隨函類衆聖之詮總為大藏凡四百八十函計五千四十八卷録而記之俾無流墮余慶曆初任知政事時西虜背惠侵擾邊遇勞師困民以殄凶醜聖人愛民恤士命余宣撫河東沿邊居民將士塗中寓宿保德氷谷之傳舍偶於堂簷罅間得故經一卷名曰因果識見頌其字皆古隸書乃藏經所未録而世所希聞者也余頗異之啓軸而觀乃十六國大阿羅漢為摩拏羅多等誦佛説因果識見悟本成佛大法之頌也一尊七頌總一百一十二頌皆直指死生之源深陳心性之法開定慧真明之宗除煩惱障毒之苦濟生戒殺誘善袪邪正漸法序四等功德説頓教陳不二法門分頓漸雖殊合利鈍無異使羣魔三惡不起於心萬法諸緣同皈於善余一句一嘆一頌一悟以至卷終胸臆豁然頓覺世緣大有所悟儻非世尊以六通萬行圓明惠鑒之聖則無以至此方知塵世之中有無邊聖法大藏之內有遺落寶文謹於府州承天寺命僧歸依別録藏之厥後示諸講説高僧通證耆達皆未見聞莫不欽信後於戊子歲有江陵老僧惠哲見訪因話此頌諸聖祕密世所希聞哲傳之於武陵僧普煥處寶之三十餘年未逢別本余因求副本正其舛駮以示善知故直序其事以紀其因時戊子仲春高平范仲淹序
