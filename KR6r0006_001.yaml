body:
  text: 天竺沙門闍那多迦譯爾時十六國大阿羅漢於毗子祁音樂樹下聽佛説因果識見悟本成佛大法罷散之後歡喜而回心性頓了咸證佛果時諸大阿羅漢悉會於崛陀山中積寶臺上有比丘僧摩拏羅多等一百五十人聞是諸羅漢聽佛説因果識見悟本成佛大法已回乃集於臺下圍繞恭敬虔懇作禮而白諸大羅漢我等纍劫修行專持戒定未曾見佛得聞正法我等聞諸聖衆聽佛説因果識見悟本成佛大法而回伏願諸聖大慈哀愍為我等傳説令得正果爾時諾矩羅尊者言汝等初入聖流未離生死雖有善果而皆執著以至未悟見佛艱難吾等見因果識見成佛大法已各省悟證果菩提時摩拏羅多復白諸尊者何名因果識見尊者言因者因緣果者果報識者識自本心見者見其本性若因緣有善果報有福則自識其本心見其本性使萬法不生當得成佛摩拏羅多復白尊者因緣果報善惡輕重惟願宣説尊者言汝等諦聽為汝説之夫人發善言者不如發善心發善心者不如行善事所以者何發善言者於福有因發善心者於福有基行善事者於福有報是故發惡言者輕於發惡心發惡心者輕於行惡事所以者何發惡言者於罪有因發惡心者於罪有基行惡事者於罪有報是以果報相對有若影響有若權衡而不差毫釐摩拏羅多等聞尊者所説齊心虔敬再三啓告願聞大法度脫未悟尊者言以是因緣得至於此時十六大阿羅漢各各會念為摩拏羅多等傳因果識見悟本成佛大法而各課七頌共一百一十二頌第一跋羅馱闍尊者因緣善惡理分明果報陰功若稱平垂此百篇因果頌説言性法惠衆生斷盡欲界更不還一靈飛上四禪天永除煩惱離生死方得那含道果全漸法頓法非兩種成道之時理一同鈍利疾遲由所見各於本性現神通孝盡於家忠盡國治家治國法皆通未知性命歸何處須向如來問苦空世間稱尺并升斗解使汝心起不平但看此般圖利者幾人待得白頭生身是僧兮心是僧身心了了是真僧世緣不染無煩惱更有何人得似僧賜汝法印定一心賜汝法權擒六賊心定賊滅真性明使汝法身常自得第二迦諾迦伐蹉尊者佛道無私啓萬門含生之類性皆存汝得一念生清淨天上人間見世尊二百五十戒行清四真善道鎮常行六通自受人天福此是阿羅聖果因性如秋月照羣方欲是浮雲苦蔽藏慧是猛風吹却後清天自見一輪光急急修行急急修年光七十去如流汝能理性除諸惡不獨披緇與剃頭一百二十滅二十一百又減三十年劫數漸滿人漸促即今七十亦為難徒將禪理論縱橫口解高談不解行無法可説方是道善根非自説中生賜汝法門開諸昧賜汝法路通諸迷昧釋明通心了了使汝法身無所疑第三諾迦跋釐馱尊者汝得為人存佛性皆從外物轉如輪汝能轉物持真性便是如來證覺身內無所得外無求清淨心源萬行周愛欲不生煩惱斷世尊妙旨在勤修終日供養求福田不求出離生死源却將福德為功德作福無由見性根富貴貧窮各有由宿緣分定莫剛求不曾下得春時種空守荒田望有秋疾病官刑與死亡孤窮貧蹙正荒忙汝能方便施恩慧何異修齋與道場得到七十百有一造成罪業無邊際不向善果早回心改頭換面何時離賜汝法船渡苦海賜汝法風蕩業塵海渡塵清到彼岸使汝法身悟至真第四蘇頻陀尊者舌身嗅視意兼聰六賊猖狂亂性宗汝守戒持并定慧用茲三法滅諸凶空中之有無形性忽然配在有形軀便任有形生妄想不尋元性是癡愚藕根種在淤泥下稟氣乘時暗吐芽漸引莖條離水面衆人方得見蓮華福自善生無別路禍因惡積理自然明明果報無差忒爭奈愚迷不自悛命終之際苦千般冤對勾牽去又還若向世緣無罣礙便如彈指捨人間福勢在時人競親福勢去後人競惡汝當有福有勢時修取前程好岐路賜汝法香除其穢賜汝法座定其性穢除性定自圓明使汝法身長清淨第五諾矩羅尊者隨處出生皆是道當時滅盡却歸空都無罣礙心清淨頓覺圓明處處通內見自性殊不動外觀諸境亦如無內心外物皆無著頓悟真如自此初定是月兮慧是光月光體用萬邪藏性中見佛無求外歸命時時爇信香日月山川皆有盡有形有滅理皆常菩提道路人行少不悟年華若電光天時地利生衣食資育衆生萬事周不起善心多枉費輪回六道報無休汝思已往平生事富貴榮華一夢中不悟死生為大事汝身有限事無窮賜汝法輪轉三毒賜汝法慧淨百垢毒消垢盡自隱安使汝法身道成就第六跋陀羅尊者自本愛欲為根蒂煩惱隨身自此來却向愛欲能斷絶自然煩惱不輪回常將智慧照其性不起諸般惡業心縱發善心還不著菩提妙果自然深菩提般若真智慧世人本性自有之心迷不悟如來意身外求時沒了期不結良因與善緣苦貪名利日憂煎豈知住世金銀寶借汝間看七十年世人但怨飢寒苦此種皆因枉費生若是守中常節儉自然衣食得豐盈汝心臥想居榮富妓樂珠金想有餘任意想歡從所欲人生一世亦何殊賜汝法扇驅邪妄賜汝法珠戒貪欲貪妄不起諸根淨使汝法身常自足第七迦哩尊者身三口四意兼三十惡隨身汝莫耽若向此中還不悟汝於性法更何堪一切塵勞諸妄想自於本性不能侵上人無我無邪見生滅根源總在心外迷著相內迷空閉塞諸門路不通於相離相方是相於空離空即是空愛欲牽纏沒了期日生煩惱鎮相隨官中囹圄猶存赦家業拘囚沒赦時蟲鳥乘春卵育時毀他巢穴取他兒有情愛育皆無異生死成冤必報之所欲常教離眼前六根不被業緣牽漸持漸戒成真性對境無心始道全賜汝法稱平嗔垢賜汝法鐘警癡聾嗔息癡悟諸善生使汝法身樂無窮第八弗多羅尊者心是佛兮佛是心存心心外佛難尋還知善惡皆心造得見如來理甚深人生本性皆清淨萬法皆存自性生心性相符無所動皎然內外自分明識自本心生自性不生不滅都無競一切時中萬物通如如不動常清淨今生有福居榮富宿有因緣理不差更向福中資福地生生福報自無涯彈丸手弩與粘糍物外無辜被殺之一命一冤皆有報暗中冤對自相隨定心靜觀諸法性更無二相皆一定有若仰然太虗空上下無礙咸清淨賜汝法杵擊羣魔賜汝法雲蔽諸愛魔降愛斷色身空使汝法身無罣礙第九戍博迦尊者汝因破暗待天明明滅之時暗又生欲得常明除暗障但持慧炬鎮常行汝悟色身無住宅須明本性定歸依一燈破却千年暗照見堂廚總是非一化化生天上樂一化化生地獄苦二化皆自性中生汝化欲歸何處去莫把含生性命輕好生惡殺物之情汝貪百味腥膻饌汝聽羣生就殺聲父母尸靈居淺土速須安葬莫因循此疑未了求諸善不免陰司作罪人身自無相而受生心因有境而生滅若無前境心自無心性了了佛何別賜汝法几離色相賜汝法劒定怖畏相離怖滅見本宗使汝法身無有二第十半諾迦尊者心為明鏡欲為塵塵厚明藏見沒因漸去漸磨浮垢盡自然通照往來人心念菩提口説空對持善惡自為通皆因色相成迷著萬劫無由見性宗地水火風化此身身滅四大各歸真諸魔六賊皆消散苦樂前程秪主人鰥寡孤獨此四民困窮無苦在飢貧汝能濟慧加存恤最向菩提是善根不懷讎怨與無明忍辱持心萬事平彼以惡來還以善深明三昧號無諍廣開心量無邊際世界山河盡總容無是無非無所著常令心等太虗空賜汝法橋濟阻厄賜汝法綬解讎冤厄度冤消無所繫使汝法身歸自然第十一羅怙羅尊者六賊清淨無煩惱煩惱無時慧自明照見萬緣皆外物一如天理秪空清空心靜坐不為空道是無空又不空有若虗空包萬象此空方始是空空善惡之終如積水資流資露漸成深善深自獲無量福惡積如何免禍侵見人患難當危困方便陰功與救之因果之中為第一福緣證果佛菩提自生至老老至病自病至死苦難量不能漸悟輪回理生死無由脫禍殃汝心向佛佛自見汝心背佛佛自無見佛自然諸善生背佛自然諸惡趨賜汝法杖悔前過賜汝法文懺前惡過省惡悛自泰然使汝法身無所著第十二那伽犀那尊者境若勝識諸善根識能勝境萬緣通內緣外境皆無著只此為空更沒空性定心定身自定脫去之時無所競從來去止是尋常祖祖相傳悉歸命前世今生有宿冤重須功德汝須還從來債負都還了交割分明離世間汝向如來求證果須憑三寶善緣增能於父母行純孝何異看經與飯僧汝貪飲宴號為歡水陸衆生殺幾般百品葷膻猶恨少試將物命算來看欲求諸佛修真性先向諸緣起善心漸覺性明諸境滅汝於佛性自然深吾今賜汝諸法物汝持此物斷邪魔邪滅魔除當見性自然功德滿恆河第十三因揭陀尊者性與心符邪不入志將道合識皆明六塵五欲咸相離證果菩提自此成一壺甘露灌心田業火成灰頓豁然忽向淨中逢本性相將飛上率陀天不殺不盜不行邪身之三善福之涯心源澄徹諸根淨豈在尋山與出家彼以害汝汝須報一往一來事有因汝若靜心能不動彼全罪業汝全真普施善利救羣生廣大慈悲一等平布施周圓無住相至哉菩薩道常行汝貪名利事無根夢幻驅驅有限身不解抽頭求出路空耽罪業作埃塵賜汝法水滅業火賜汝法雨生善根火滅善生心境淨使汝法身見世尊第十四伐那婆斯尊者去盡塵埃洗盡瑕晈如明月照天涯諸邪不動無形相此去如來路不遐摩訶般若波羅蜜理性理心為第一無住無去亦無來三世諸佛自此出未來之事思難及已往之事不足道秪據眼前為見在自然煩惱不相隨殺生欠負兩般事罪業之中第一深施惠放生還却債可於三惡免漂沈勿捨小善而不作積之自與福為強莫將小惡為無事小惡增來作大殃修得人天道果成天華天樂自來迎迎皈兜率陀天上彌勒當來説上生賜汝法燈破諸暗賜汝法鏡照諸罪暗消罪滅豁然明使汝法身常自在第十五阿氏多尊者萬行周通能覺性驅除煩惱更勤修七生七死方成道初等陀洹入聖流前念未悟成罪業後念善悟諸罪滅今念念念在空空皎然智慧如明月萬緣善果無如孝罪業之中不孝深若向此中明善惡自然暗合覺皇心漸逢燕并龜鱉莫惜資金買放之償却今生餐過死免教冤債暗相隨堅持行戒除諸惡身在家中心是僧何必出家方見道中心了了悟三乘自然音樂樂無涯七寶樓臺麗日霞上妙衆香常不散繽紛雲裏雨天華賜汝法刀斷煩惱賜汝法鑰開囚鎖煩惱不生枷杻解使汝法身成證果第十六注荼半託迦尊者功行將成尚往還一生天上一人間方能證得阿羅位此號陀含度上關多將布施為功德見性為功德是平外事善因為住相此名福德甚分明萬事因緣有對持死生榮辱分皆知心田自廣無憂惱湯火兵刀不畏之己欲萬端求利路暗施機穽陷他人汝看此等稱能者果報何人到子孫心不離家身出家不除諸惡挂袈裟此般罪障恆河等三惡塗中莫怨嗟種種善緣深譬喻廣施言教破迷昏衆生諦聽咸皈信的的如來不妄言賜汝法鋤去惡根賜汝法田長善苗惡盡善成功德就使汝法身自逍遙如是十六大阿羅漢為摩拏羅多頌佛因果識見悟本成佛大法既畢復言吾等所頌者皆世尊金口叮嚀開悟衆聖令得證果成佛之言吾今記而頌之垂緣後覺汝當以因果識見頌為名吾復為世間衆生背善向惡多所迷著吾垂此真頌當於末劫流在人間汝等恭敬奉持度脫衆生令免離生死之苦廣為説言警悟後學俾諸善識見此妙言咸得證果時摩拏羅多聞是十六國大阿羅漢教頌覺悟頓釋迷著心性了了恭敬奉信久久作禮而退十六大阿羅漢聖迹附詳于法住記梵語阿羅漢華言無學謂其生死已盡無法可學又云無生謂其斷見思惑盡無復三界受生又云應供謂其應受人天供養又云殺賊謂其能殺煩惱之賊以其皆具三明六通無量功德故稱為大此阿羅漢承佛敕故以神通力延自壽量住於世間守護正法至今猶未入滅若遇世間設大施無遮會時即同諸眷屬蔽隱聖儀同於凡流密受供養令施者得勝果報饒益有情是為十六大阿羅漢也三明者天眼明宿命明漏盡明也六通者天眼通天耳通宿命通他心通神足通漏盡通也一者賓度羅跋囉惰尊者梵語賓度羅華言不動字也梵語跋囉惰闍華言捷疾姓也此尊者與千阿羅漢多分住在西瞿耶尼洲梵語瞿耶尼華言牛貨二迦諾迦伐蹉尊者梵語迦諾迦伐蹉無翻此尊者與五百阿羅漢多分住在北方迦濕彌羅國三迦諾迦跋釐惰闍尊者梵語迦諾迦跋釐惰闍無翻此尊者與六百阿羅漢多分住在東勝身洲四蘇頻陀尊者梵語蘇頻陀無翻此尊者與七百阿羅漢多分住在北俱盧洲五諾詎羅尊者梵語諾詎羅華言鼠狼山此尊者與八百阿羅漢多分住在南贍部洲梵語贍部亦云閻浮提華言勝金洲六跋陀羅尊者梵語跋陀羅華言好賢此尊者與九百阿羅漢多分住在耽沒羅洲七迦哩迦尊者梵語迦哩迦無翻此尊者與千阿羅漢多分住在僧伽荼洲八伐闍羅弗多羅尊者梵語伐闍羅弗多羅無翻此尊者與一千一百阿羅漢多分住在鉢剌拏洲九戍博迦尊者梵語戍博迦無翻此尊者與九百阿羅漢多分住在香醉山中十半托迦尊者梵語半托迦無翻此尊者與一千三百阿羅漢多分住在三十三天三十三天即忉利天也十一囉怙羅尊者梵語羅怙羅華言執日此尊者與一千一百阿羅漢多分住在畢利揚瞿洲十二那伽犀那尊者梵語那伽犀那無翻此尊者與一千二百阿羅漢多分住在半度波山十三因揭陀尊者梵語因揭陀無翻此尊者與一千三百阿羅漢多分住在廣脅山中十四伐那婆斯尊者梵語伐那婆斯無翻此尊者與一千四百阿羅漢多分住在可住山中十五阿氏多尊者梵語阿氏多無翻此尊者與一千五百阿羅漢多分住在鷲峯山中十六注荼半托迦尊者梵語注荼半托迦無翻此尊者與一千六百阿羅漢多分住在持軸山中
